# Builds Jean for every platform and publishes it.
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# Each platform is built on a machine of its own kind, so the Rust core is
# compiled natively and every binary is started once (`jean --version`)
# before anything is published. Then:
#
#   - npm: jean-code-<os>-<cpu> for each platform, then jean-code itself,
#     so `npm install -g jean-code` gives a working `jean`
#   - a GitHub release with the archives install.sh and install.ps1 download
#
# Publishing needs an npm token with publish rights, saved as the repository
# secret NPM_TOKEN. "Run workflow" by hand builds and tests without
# publishing, unless `publish` is ticked.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.2.0)'
        required: true
      publish:
        description: 'Publish to npm and create the GitHub release'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

env:
  VERSION: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-latest }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: darwin-arm64, runner: macos-latest }
          # Intel Macs: built on an ARM Mac, with the Rust core cross-compiled.
          - { target: darwin-x64, runner: macos-latest, rust-target: x86_64-apple-darwin }
          - { target: win32-x64, runner: windows-latest }
          - { target: win32-arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-target }}

      # Every platform's OpenTUI library, so a cross-built binary gets its own.
      - run: bun install --os='*' --cpu='*'

      - name: Build
        shell: bash
        run: >
          bun scripts/release/build.ts
          --target ${{ matrix.target }}
          --version "${VERSION#v}"
          --native
          ${{ matrix.rust-target && format('--rust-target {0}', matrix.rust-target) || '' }}

      - name: Start it once
        if: ${{ !matrix.rust-target }}
        shell: bash
        run: |
          exe=dist/npm/jean-code-${{ matrix.target }}/bin/jean
          [ -f "$exe.exe" ] && exe="$exe.exe"
          out=$("$exe" --version)
          echo "$out"
          [ "$out" = "jean ${VERSION#v}" ]

      - uses: actions/upload-artifact@v4
        with:
          name: jean-${{ matrix.target }}
          path: |
            dist/npm/jean-code-${{ matrix.target }}
            dist/release/*
          if-no-files-found: error

  publish:
    needs: build
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: The launcher package
        shell: bash
        run: bun scripts/release/build.ts --main-only --version "${VERSION#v}"

      # Platform packages first: jean-code depends on them, and a user who
      # installs in between would otherwise get a launcher with nothing to run.
      - name: Publish to npm
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Artifacts do not keep the executable bit; npm publishes what is on disk.
          for exe in artifacts/*/npm/jean-code-*/bin/jean artifacts/*/npm/jean-code-*/bin/pi-natives; do
            [ -f "$exe" ] && chmod +x "$exe"
          done
          for dir in artifacts/*/npm/jean-code-*; do
            npm publish "$dir" --access public --provenance
          done
          npm publish dist/npm/jean-code --access public --provenance

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}
          files: artifacts/*/release/*
          generate_release_notes: true
